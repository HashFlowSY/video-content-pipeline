[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "video-content-pipeline"
version = "0.1.0"
description = "A local, auditable video content processing pipeline."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
vcp = "video_content_pipeline.cli:main"
vcp-prototype = "video_content_pipeline.prototype_runs:main"

[dependency-groups]
dev = [
  "hatchling==1.27.0",
  "hypothesis==6.165.9",
  "mypy==1.15.0",
  "pytest==8.3.5",
  "ruff==0.11.5",
]
# Phase 11 one-shot authorized inference stack (spec Workstream B). Real model
# engines only; the deterministic offline adapters need none of these, so the
# base project keeps `dependencies = []`. Exact-pinned, with two spec-declared
# exceptions: opencv-python is a declared floor pinned by the lock, and
# huggingface-hub tracks latest-stable (unpinned, pinned by the lock). See
# docs/PHASE_11_SPECIFICATION.md.
inference = [
  "mlx-audio==0.4.8",
  "mlx-whisper==0.4.3",
  "mlx-lm==0.31.3",
  "sherpa-onnx==1.13.5",
  # sherpa-onnx ships its native runtime in this companion package, but its
  # wheel marks `requires-dist` as Dynamic, so uv's registry-metadata resolver
  # drops the edge (pip would recover it post-install). Pin it explicitly so
  # the native libs (libonnxruntime.dylib) are actually installed. Same version.
  "sherpa-onnx-core==1.13.5",
  "onnxruntime==1.28.0",
  "rapidocr==3.9.2",
  "opencv-python>=4.5.1.48",
  "huggingface-hub",
]

[tool.hatch.build.targets.wheel]
packages = ["src/video_content_pipeline"]

[tool.uv]
# RECORDED DEVIATION (Phase 11 ticket 03): mlx-whisper==0.4.3 declares `torch`
# as an unconditional runtime dependency in every published version, which
# would drag torch + the entire nvidia-*/triton/cuda-* CUDA stack into the
# lock and violate the phase's torch-free invariant (spec Workstream B; user
# story 3). The dependency is a phantom for our path: torch is referenced only
# by `mlx_whisper/torch_whisper.py` (the OpenAI-checkpoint -> MLX conversion
# reference), which nothing in the package imports; transcription
# (`mlx_whisper.transcribe`) runs on pre-converted `whisper-large-v3-mlx`
# weights and never touches torch. This override drops torch (and its whole
# subtree) from resolution via an always-false marker, keeping the installed
# stack genuinely torch-free. The lockfile gate (tests/unit/test_lockfile_gate.py)
# enforces that no banned distribution is ever *resolved* into uv.lock.
override-dependencies = ["torch; sys_platform == 'never'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers"]
markers = [
  "integration: exercises real external tools or the real filesystem end to end",
  "slow: takes appreciable wall-clock time relative to the unit layer",
  "faultmatrix: enumerates orchestration fault points (developer convenience)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unused_configs = true

# onnxruntime ships no py.typed; the real VAD engine (Phase 11 ticket 06) is the
# first in-process ONNX consumer. Its wrapper is fully typed at our boundary.
[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

# sherpa-onnx ships no py.typed; the real diarization engine (Phase 11 ticket 07)
# runs its offline speaker-diarization pipeline in-process. Its wrapper is fully
# typed at our boundary.
[[tool.mypy.overrides]]
module = ["sherpa_onnx", "sherpa_onnx.*"]
ignore_missing_imports = true

# mlx / mlx-audio ship no py.typed; the real forced-alignment engine (Phase 11
# ticket 08) loads Qwen3-ForcedAligner only inside its Model runtime subprocess
# child. The heavy imports are confined to that child module.
[[tool.mypy.overrides]]
module = ["mlx", "mlx.*", "mlx_audio", "mlx_audio.*"]
ignore_missing_imports = true

# mlx-whisper ships no py.typed; the real review ASR engine (Phase 11 ticket 09)
# loads whisper-large-v3 only inside its Model runtime subprocess child, and only
# via ``mlx_whisper.transcribe`` (never ``mlx_whisper.torch_whisper``).
[[tool.mypy.overrides]]
module = ["mlx_whisper", "mlx_whisper.*"]
ignore_missing_imports = true

# mlx-lm ships py.typed but exposes untyped helpers (e.g. the tokenizer's
# apply_chat_template) and a union-typed load(); the real text-semantics engine
# (Phase 11 ticket 10) loads Qwen3-4B only inside its Model runtime subprocess
# child, so treat the package as untyped there rather than annotate around it.
[[tool.mypy.overrides]]
module = ["mlx_lm", "mlx_lm.*"]
ignore_missing_imports = true
follow_imports = "skip"

# rapidocr and opencv (cv2) ship no py.typed; the real OCR engine (Phase 11
# ticket 11) runs the bundled PP-OCRv6 pipeline in-process via rapidocr /
# onnxruntime. The heavy imports are confined to the engine's inference helpers.
[[tool.mypy.overrides]]
module = ["rapidocr", "rapidocr.*", "cv2", "cv2.*"]
ignore_missing_imports = true

# tokenizers ships no py.typed; the text-semantics engine (Phase 12 ticket 08) uses
# it only for a best-effort pre-flight prompt token count before the model loads.
[[tool.mypy.overrides]]
module = ["tokenizers", "tokenizers.*"]
ignore_missing_imports = true
